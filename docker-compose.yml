# Ekomino CV Screening, the whole system on one machine.
#   docker compose up -d --build
# HR panel → http://localhost:3000 · n8n → http://localhost:5678 · mailbox → http://localhost:8025

services:
  n8n:
    image: n8nio/n8n:2.48.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    entrypoint: ["/bin/sh", "/opt/ekomino/start.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/opt/ekomino:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      N8N_INTERNAL_URL: http://n8n:5678
      N8N_PUBLIC_URL: http://localhost:5678
      MAILPIT_PUBLIC_URL: http://localhost:8025
      CONCURRENCY: "2"
    volumes:
      - web_data:/app/data
      - ./inbox:/app/inbox
    depends_on:
      n8n:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  n8n_data:
  web_data:
